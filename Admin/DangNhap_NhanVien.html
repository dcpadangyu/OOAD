<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập nhân viên</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="assets/css/DangNhap_Admin.css">
    <link rel="stylesheet" href="assets/css/admin-luxury-theme.css">
</head>

<body>
    <div class="main-container">
        <!-- Phần nền đen bên trái -->
        <div class="dark-section">
            <div class="dark-content">
                <div class="dark-text">
                    <h1>Shoe-Store</h1>
                    <h2>Khu vực nhân viên</h2>
                    <p>Đăng nhập để bán hàng, nhập kho và quản lý tồn kho, đơn hàng theo phân quyền của cửa hàng.</p>
                    <div class="features">
                        <div class="feature-item">
                            <div class="feature-icon">
                                <i class="fa-solid fa-shield-halved fa-2x"></i>
                            </div>
                            <span>Phân quyền theo chức vụ</span>
                        </div>
                        <div class="feature-item">
                            <div class="feature-icon">
                                <i class="fa-solid fa-box-open fa-2x"></i>
                            </div>
                            <span>Quản lý sản phẩm & kho hàng</span>
                        </div>
                        <div class="feature-item">
                            <div class="feature-icon">
                                <i class="fa-solid fa-clipboard-check fa-2x"></i>
                            </div>
                            <span>Xử lý đơn hàng nhanh chóng</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Phần đăng nhập bên phải -->
        <div class="login-section">
            <div class="login-container">
                <div class="login-box">
                    <div class="login-header">
                        <h1>Đăng nhập nhân viên</h1>
                        <p>Vui lòng nhập thông tin tài khoản nhân viên</p>
                    </div>

                    <form class="login-form" id="loginForm">
                        <div class="form-group">
                            <label for="username">Tên đăng nhập</label>
                            <div class="input-wrapper">
                                <div class="input-icon">
                                    <i class="fa-solid fa-user"></i>
                                </div>
                                <input type="text" id="username" name="username" required>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="password">Mật khẩu</label>
                            <div class="input-wrapper">
                                <div class="input-icon">
                                    <i class="fa-solid fa-lock"></i>
                                </div>
                                <input type="password" id="password" name="password" required>
                            </div>
                        </div>

                        <div class="form-group checkbox-group">
                            <input type="checkbox" id="remember" name="remember">
                            <label for="remember">Ghi nhớ đăng nhập</label>
                        </div>

                        <button type="submit" class="login-btn">Đăng nhập</button>
                    </form>

                    <div class="login-footer">
                        <a href="DangNhap_Admin.html">Đăng nhập quản trị viên</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="notification" id="notification"></div>

    <script src="../database/employees.js"></script>
    <script src="assets/js/nhanvien-session.js"></script>
    <script src="assets/js/DangNhap_NhanVien.js"></script>
</body>

</html>
