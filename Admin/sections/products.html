<section id="page-products" class="spa-page">
            <!-- Content from QuanLySanPham.html (main) -->
            <div class="QLSP_page-header">
              <h3>Quản lý sản phẩm</h3>
              <p>Quản lý danh mục sản phẩm, thêm/sửa/xóa sản phẩm</p>
            </div>

            <!-- Bộ lọc -->
            <div class="QLSP_boLoc">
              <select id="QLSP_locDanhMuc">
                <option value="all">Tất cả</option>
                <option value="Nike">Nike</option>
                <option value="Adidas">Adidas</option>
                <option value="Converse">Converse</option>
                <option value="MLB">MLB</option>
                <option value="Vans">Vans</option>
              </select>
              <div style="position: relative; display: inline-block">
                <input
                  type="text"
                  id="QLSP_timId"
                  placeholder="Tìm theo mã hoặc tên..."
                  autocomplete="off"
                />
                <div id="QLSP_goiY" class="QLSP_goiY"></div>
              </div>
              <input
                type="button"
                id="QLSP_btnThemMoiSP"
                value="Thêm mới sản phẩm"
              />
            </div>

            <!-- Tiêu đề bảng -->
            <div class="QLSP_table-header">
              <table class="QLSP_table-header">
                <tr>
                  <th style="width: 5%">Stt</th>
                  <th style="width: 12%">Mã</th>
                  <th style="width: 20%">Tên</th>
                  <th style="width: 15%">Danh mục</th>
                  <th style="width: 20%">Mô tả</th>
                  <th style="width: 10%">Ảnh</th>
                  <th style="width: 10%">Hiển thị</th>
                  <th style="width: 8%">Tác vụ</th>
                </tr>
              </table>
            </div>

            <!-- Nội dung bảng -->
            <div class="QLSP_table-content"></div>

            <div id="product-container" class="QLSP_product-container"></div>
            <!-- Phân trang -->
            <div class="QLSP_pagi">
              <button id="QLSP_prevPage" class="QLSP_pagination-btn">
                Trước
              </button>
              <span id="QLSP_pageInfo">Trang 1 / 1</span>
              <button id="QLSP_nextPage" class="QLSP_pagination-btn">
                Sau
              </button>
            </div>

            <!-- Modal Thêm Sản Phẩm -->
            <div id="QLSP_modalThemSP" class="QLSP_modal">
              <div class="QLSP_modal-content">
                <div class="QLSP_modal-header">
                  <h3>Thêm mới sản phẩm</h3>
                  <span class="QLSP_close-btn" id="QLSP_btnCloseModal"
                    >&times;</span
                  >
                </div>
                <hr />

                <form id="QLSP_formThemSP">
                  <label for="QLSP_spId">Mã sản phẩm</label>
                  <input type="text" id="QLSP_spId" required />

                  <label for="QLSP_spCatalog">Danh mục</label>
                  <select id="QLSP_spCatalog">
                    <option value="Nike">Nike</option>
                    <option value="Adidas">Adidas</option>
                    <option value="Converse">Converse</option>
                    <option value="MLB">MLB</option>
                    <option value="Vans">Vans</option>
                  </select>

                  <label for="QLSP_spName">Tên sản phẩm</label>
                  <input type="text" id="QLSP_spName" required />

                  <label for="QLSP_spGender">Giới tính</label>
                  <select id="QLSP_spGender">
                    <option value="Nam">Nam</option>
                    <option value="Nữ">Nữ</option>
                  </select>

                  <label for="QLSP_spDesc">Mô tả</label>
                  <textarea id="QLSP_spDesc" rows="3"></textarea>

                  <label for="QLSP_spColor">Màu sắc</label>
                  <select id="QLSP_spColor">
                    <option value="Đen" selected>Đen</option>
                    <option value="Trắng">Trắng</option>
                    <option value="Vàng">Vàng</option>
                    <option value="Bạc">Bạc</option>
                    <option value="Hồng">Hồng</option>
                    <option value="Xanh lá">Xanh lá</option>
                    <option value="Xanh dương">Xanh dương</option>
                  </select>

                  <label for="QLSP_spMaterial">Chất liệu giày</label>
                  <select id="QLSP_spMaterial">
                    <option value="Da">Da</option>
                    <option value="Vải">Vải</option>
                    <option value="Da tổng hợp">Da tổng hợp</option>
                  </select>

                  <label for="QLSP_spStyle">Phong cách giày</label>
                  <select id="QLSP_spStyle">
                    <option value="Casual">Casual</option>
                    <option value="Thể thao">Thể thao</option>
                  </select>

                  <label for="QLSP_spImportPrice">Giá nhập (VNĐ)</label>
                  <input type="number" id="QLSP_spImportPrice" required />

                  <hr />

                  <label>Size sẽ bán <small>(số lượng tồn nhập qua <b>Phiếu nhập hàng</b>)</small></label>
                  <input type="hidden" id="QLSP_spSize" />
                  <div id="QLSP_spSizeEditor"></div>

                  <label for="QLSP_spDescription">Mô tả chi tiết</label>
                  <textarea id="QLSP_spDescription" rows="3"></textarea>

                  <label class="QLSP_file-upload-label">
                    <span>📷 Chọn ảnh sản phẩm</span>
                    <input
                      type="file"
                      id="QLSP_spImage"
                      accept="image/*"
                      class="QLSP_file-input"
                    />
                  </label>
                  <div class="QLSP_preview-image" id="QLSP_previewImage"></div>

                  <div class="QLSP_modal-buttons">
                    <button type="submit" id="QLSP_btnSaveSP">Lưu</button>
                    <button
                      type="button"
                      class="QLSP_cancel-btn"
                      id="QLSP_btnCancelSP"
                    >
                      Hủy
                    </button>
                  </div>
                </form>
              </div>
            </div>

            <!-- Modal Sửa Sản Phẩm -->
            <div id="QLSP_modalSuaSP" class="QLSP_modal">
              <div class="QLSP_modal-content">
                <div class="QLSP_modal-header">
                  <h3>Sửa thông tin sản phẩm</h3>
                  <span class="QLSP_close-btn" id="QLSP_btnCloseModalSua"
                    >&times;</span
                  >
                </div>

                <label for="QLSP_editId">Mã sản phẩm</label>
                <input type="text" id="QLSP_editId" readonly />

                <label for="QLSP_editCatalog">Danh mục</label>
                <select id="QLSP_editCatalog">
                  <option value="Nike" selected>Nike</option>
                  <option value="Adidas">Adidas</option>
                  <option value="Converse">Converse</option>
                  <option value="MLB">MLB</option>
                  <option value="Vans">Vans</option>
                </select>

                <label for="QLSP_editName">Tên sản phẩm</label>
                <input type="text" id="QLSP_editName" />

                <label for="QLSP_editGender">Giới tính</label>
                <select id="QLSP_editGender">
                  <option value="Nam">Nam</option>
                  <option value="Nữ">Nữ</option>
                </select>

                <label for="QLSP_editDesc">Mô tả</label>
                <textarea id="QLSP_editDesc" rows="2"></textarea>

                <label for="QLSP_editColor">Màu sắc</label>
                <select id="QLSP_editColor">
                  <option value="Đen" selected>Đen</option>
                  <option value="Trắng">Trắng</option>
                  <option value="Vàng">Vàng</option>
                  <option value="Bạc">Bạc</option>
                  <option value="Hồng">Hồng</option>
                  <option value="Xanh lá">Xanh lá</option>
                  <option value="Xanh dương">Xanh dương</option>
                </select>

                <label for="QLSP_editImportPrice">Giá nhập (VNĐ)</label>
                <input type="number" id="QLSP_editImportPrice" />

                <label for="QLSP_editVisibility">Hiển thị</label>
                <select id="QLSP_editVisibility">
                  <option value="visible">Hiển thị</option>
                  <option value="hidden">Ẩn</option>
                </select>

                <label for="QLSP_editMaterial">Chất liệu giày</label>
                <select id="QLSP_editMaterial">
                  <option value="Da">Da</option>
                  <option value="Vải">Vải</option>
                  <option value="Da tổng hợp">Da tổng hợp</option>
                </select>

                <label for="QLSP_editStyle">Phong cách giày</label>
                <select id="QLSP_editStyle">
                  <option value="Casual">Casual</option>
                  <option value="Thể thao">Thể thao</option>
                </select>

                <hr />

                <label>Size <small>(thêm/bớt size; số lượng tồn chỉ đổi qua <b>Phiếu nhập hàng</b> hoặc khi bán)</small></label>
                <input type="hidden" id="QLSP_editSize" />
                <div id="QLSP_editSizeEditor"></div>

                <label for="QLSP_editDescription">Mô tả chi tiết</label>
                <textarea id="QLSP_editDescription" rows="3"></textarea>

                <label class="QLSP_file-upload-label">
                  <span>📷 Chọn ảnh sản phẩm</span>
                  <input type="file" id="QLSP_editImage" accept="image/*" class="QLSP_file-input" />
                </label>
                <div class="QLSP_preview-image">
                  <img
                    id="QLSP_previewEditImg"
                    src=""
                    alt="Xem trước hình ảnh"
                  />
                </div>

                <div class="QLSP_modal-buttons">
                  <button id="QLSP_btnUpdateSP">Lưu thay đổi</button>
                  <button class="QLSP_cancel-btn" id="QLSP_btnCancelEdit">
                    Hủy
                  </button>
                </div>
              </div>
            </div>
          </section>
