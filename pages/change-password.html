<body>
<div data-user-component="header"></div>
<section class="page-section" id="section-doimatkhau">
<div class="profile-layout">
<aside class="profile-sidebar">
<div class="user-info">
<img alt="avatar" id="sideAvatar-doimatkhau" src="./assets/img/Avatar/avtuser.jpg"/>
<h4 id="sideUsername-doimatkhau">Người dùng</h4>
</div>
<ul class="sidebar-menu">
<li><a href="pages/profile.html">Hồ Sơ</a></li>
<li><a href="pages/address.html">Địa Chỉ Giao Hàng</a></li>

<li class="active"><a href="pages/change-password.html">Đổi Mật Khẩu</a></li>
</ul>
</aside>
<section class="profile-content single-column">
<h2>Đổi mật khẩu</h2>
<p class="subtitle">Thay đổi mật khẩu của bạn</p>
<form class="profile-form" id="changePasswordForm">
<div class="form-group">
<label>Mật khẩu hiện tại</label>
<input id="currentPassword" type="password"/>
</div>
<div class="form-group">
<label>Hoặc mã OTP Gmail</label>
<input id="changePasswordOtp" inputmode="numeric" maxlength="6" type="text"/>
<button id="send-change-password-otp" type="button">GỬI OTP QUA GMAIL</button>
</div>
<div class="form-group">
<label>Mật khẩu mới</label>
<input id="newPassword" required="" type="password"/>
</div>
<div class="form-group">
<label>Xác nhận mật khẩu mới</label>
<input id="confirmNewPassword" required="" type="password"/>
</div>
<div class="form-actions">
<button class="save-btn" type="submit">Đổi mật khẩu</button>
</div>
</form>
</section>
</div>
</section>
<div data-user-component="footer"></div>

</body>
