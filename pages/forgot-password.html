<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<base href="../">
<title>Shoe Store - Quên mật khẩu</title>
<link rel="stylesheet" href="assets/css/user/variables.css">
<link rel="stylesheet" href="assets/css/user/base.css">
<link rel="stylesheet" href="assets/css/user/common.css">
<link rel="stylesheet" href="assets/css/user/header.css">
<link rel="stylesheet" href="assets/css/user/footer.css">
<link rel="stylesheet" href="assets/css/user/register.css">
<link rel="stylesheet" href="assets/css/user/theme.css">
<link rel="stylesheet" href="assets/css/user/modern.css">
<link rel="stylesheet" href="assets/css/user/redesign.css?v=20260923-2317">
</head>
<body>
<div data-user-component="header"></div>
<section class="page-section" id="section-forgot-password">
  <div class="main-content">
    <div class="form-container">
      <h2>QUÊN MẬT KHẨU</h2>
      <form class="form-login" id="forgot-password-form">
        <div class="input-group">
          <label for="forgot-email">Email đăng ký</label>
          <input id="forgot-email" type="email" required placeholder="VD: user@gmail.com">
        </div>
        <div class="input-group">
          <button id="send-forgot-otp" type="button">GỬI MÃ OTP</button>
        </div>
        <div class="input-group">
          <label for="forgot-otp">Mã OTP Gmail</label>
          <input id="forgot-otp" inputmode="numeric" maxlength="6" required>
        </div>
        <div class="input-group">
          <label for="forgot-new-password">Mật khẩu mới</label>
          <input id="forgot-new-password" type="password" minlength="8" required>
        </div>
        <div class="input-group">
          <label for="forgot-confirm-password">Xác nhận mật khẩu mới</label>
          <input id="forgot-confirm-password" type="password" minlength="8" required>
        </div>
        <div class="input-group">
          <button type="submit">ĐỔI MẬT KHẨU</button>
        </div>
        <p><a href="pages/login.html">Quay lại đăng nhập</a></p>
      </form>
    </div>
  </div>
</section>
<div data-user-component="footer"></div>
<script src="assets/js/user/core/site-shell.js"></script>
<script src="assets/js/user/core/account-session.js"></script>
<script src="assets/js/user/core/site-header.js"></script>
<script src="assets/js/user/core/otp-api.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="assets/js/user/account/forgot-password.js"></script>
</body>
</html>
